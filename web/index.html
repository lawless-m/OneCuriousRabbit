<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice OCR</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .subtitle {
            color: #666;
            margin-bottom: 2rem;
        }

        .status-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 0.75rem 1rem;
            background: white;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.connected { background: #22c55e; }
        .status-dot.error { background: #ef4444; }

        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 3rem;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .drop-zone.processing {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .drop-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .drop-text {
            color: #666;
        }

        .drop-text strong {
            color: #2563eb;
        }

        input[type="file"] {
            display: none;
        }

        .results {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .results-header {
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
        }

        .result-item {
            padding: 1rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .result-filename {
            font-weight: 500;
        }

        .result-confidence {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            background: #dcfce7;
            color: #166534;
        }

        .result-confidence.low {
            background: #fef3c7;
            color: #92400e;
        }

        .result-details {
            font-size: 0.875rem;
            color: #666;
        }

        .result-json {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f9fafb;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 200px;
            overflow: auto;
            display: none;
        }

        .result-json.show {
            display: block;
        }

        .toggle-json {
            font-size: 0.75rem;
            color: #2563eb;
            cursor: pointer;
            text-decoration: underline;
            margin-right: 1rem;
        }

        .download-btn {
            font-size: 0.75rem;
            color: #059669;
            cursor: pointer;
            text-decoration: underline;
        }

        .error-message {
            color: #dc2626;
            padding: 1rem;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .settings {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        .settings label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .settings input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Invoice OCR</h1>
        <p class="subtitle">Extract structured data from PDF invoices</p>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot" id="serverStatus"></span>
                <span id="serverStatusText">Checking server...</span>
            </div>
            <div class="status-item" id="modelInfo" style="display: none;">
                Model: <span id="modelName">-</span>
            </div>
        </div>

        <!-- Server URL hidden - using relative paths for reverse proxy -->
        <input type="hidden" id="serverUrl" value="api">

        <div class="drop-zone" id="dropZone">
            <div class="drop-icon">📄</div>
            <p class="drop-text">
                <strong>Drop PDF here</strong> or click to browse
            </p>
            <input type="file" id="fileInput" accept=".pdf,image/*" multiple>
        </div>

        <div class="results" id="results" style="display: none;">
            <div class="results-header">Extraction Results</div>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const results = document.getElementById('results');
        const resultsList = document.getElementById('resultsList');
        const extractionData = {}; // Store extraction results for download

        function getServerUrl() {
            return document.getElementById('serverUrl').value.trim();
        }

        // Check server status
        async function checkStatus() {
            const statusDot = document.getElementById('serverStatus');
            const statusText = document.getElementById('serverStatusText');
            const modelInfo = document.getElementById('modelInfo');
            const modelName = document.getElementById('modelName');

            try {
                const res = await fetch(`${getServerUrl()}/status`, { timeout: 5000 });
                const data = await res.json();

                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Ready';

                if (data.model_loaded) {
                    modelInfo.style.display = 'block';
                    modelName.textContent = data.model_name || 'Loaded';
                } else {
                    modelInfo.style.display = 'block';
                    modelName.textContent = 'Will load on first upload (~30s)';
                }
            } catch (e) {
                statusDot.className = 'status-dot error';
                statusText.textContent = '⚠️ Server offline or not properly configured';
                modelInfo.style.display = 'none';
            }
        }

        // Check status on load
        checkStatus();
        setInterval(checkStatus, 10000);

        // Drag and drop
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
        });

        async function handleFiles(files) {
            for (const file of files) {
                await processFile(file);
            }
        }

        async function processFile(file) {
            results.style.display = 'block';

            // Add processing indicator
            const itemId = 'result-' + Date.now();
            resultsList.insertAdjacentHTML('afterbegin', `
                <div class="result-item" id="${itemId}">
                    <div class="result-header">
                        <span class="result-filename">
                            <span class="spinner"></span>
                            ${file.name}
                        </span>
                    </div>
                    <div class="result-details">Processing...</div>
                </div>
            `);

            dropZone.classList.add('processing');

            try {
                // Convert file to base64
                const base64 = await fileToBase64(file);

                // Send to server
                const res = await fetch(`${getServerUrl()}/extract-base64`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename: file.name,
                        data: base64,
                        prompt: getDefaultPrompt()
                    })
                });

                const data = await res.json();

                if (data.success) {
                    updateResult(itemId, file.name, data.data, true);
                } else {
                    updateResult(itemId, file.name, { error: data.error }, false);
                }
            } catch (e) {
                let errorMsg = e.message;
                if (e.message.includes('Failed to fetch')) {
                    errorMsg = 'Server not responding - check if inference server is running at ' + getServerUrl();
                } else if (e.message.includes('NetworkError')) {
                    errorMsg = 'Network error - cannot reach server at ' + getServerUrl();
                }
                updateResult(itemId, file.name, { error: errorMsg }, false);
            }

            dropZone.classList.remove('processing');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
            });
        }

        function updateResult(itemId, filename, data, success) {
            const item = document.getElementById(itemId);

            if (success && data.header) {
                // Store extraction data for download
                extractionData[itemId] = { filename, data };
                const confidence = data.confidence?.overall;
                const confidenceClass = confidence && confidence < 0.7 ? 'low' : '';
                const confidenceText = confidence ? `${(confidence * 100).toFixed(0)}% confidence` : '';
                const lineCount = data.line_items?.length || 0;

                item.innerHTML = `
                    <div class="result-header">
                        <span class="result-filename">${filename}</span>
                        ${confidenceText ? `<span class="result-confidence ${confidenceClass}">${confidenceText}</span>` : ''}
                    </div>
                    <div class="result-details">
                        <strong>${data.header.supplier_name || 'Unknown'}</strong> -
                        Invoice ${data.header.invoice_number || 'N/A'} -
                        ${data.header.currency || ''} ${data.header.gross_total?.toFixed(2) || '0.00'} -
                        ${lineCount} line item${lineCount !== 1 ? 's' : ''}
                        <span class="toggle-json" onclick="toggleJson('${itemId}')">Show JSON</span>
                        <span class="download-btn" onclick="downloadExcel('${itemId}', '${filename}')">Download Excel</span>
                    </div>
                    <pre class="result-json" id="json-${itemId}">${JSON.stringify(data, null, 2)}</pre>
                `;
            } else {
                let errorDetails = data.error || 'Unknown error';
                let helpText = '';

                if (errorDetails.includes('Server not responding')) {
                    helpText = '<br><small>The backend inference server is not responding. Check server logs.</small>';
                } else if (errorDetails.includes('out of memory') || errorDetails.includes('OOM')) {
                    helpText = '<br><small>GPU is busy with another task. Wait a moment and try again.</small>';
                } else if (errorDetails.includes('timeout')) {
                    helpText = '<br><small>Model is loading (may take 30-60 seconds on first request).</small>';
                }

                item.innerHTML = `
                    <div class="result-header">
                        <span class="result-filename">${filename}</span>
                    </div>
                    <div class="error-message">
                        ${errorDetails}
                        ${helpText}
                    </div>
                `;
            }
        }

        function toggleJson(itemId) {
            const json = document.getElementById('json-' + itemId);
            json.classList.toggle('show');
        }

        function downloadExcel(itemId, filename) {
            const extraction = extractionData[itemId];
            if (!extraction) return;

            const { data } = extraction;

            // Create workbook
            const wb = XLSX.utils.book_new();

            // Header sheet
            const headerData = [
                ['Field', 'Value'],
                ['Supplier', data.header.supplier_name || ''],
                ['Customer', data.header.customer_name || ''],
                ['Invoice Number', data.header.invoice_number || ''],
                ['Invoice Date', data.header.invoice_date || ''],
                ['PO Reference', data.header.po_reference || ''],
                ['Currency', data.header.currency || ''],
                ['Net Total', data.header.net_total || 0],
                ['VAT Amount', data.header.vat_amount || 0],
                ['Gross Total', data.header.gross_total || 0],
                ['Payment Due Date', data.header.payment_due_date || '']
            ];
            const wsHeader = XLSX.utils.aoa_to_sheet(headerData);
            XLSX.utils.book_append_sheet(wb, wsHeader, 'Header');

            // Line items sheet
            if (data.line_items && data.line_items.length > 0) {
                const lineItemsData = [
                    ['Line', 'Product Code', 'Description', 'Quantity', 'Unit', 'Unit Price', 'VAT Rate', 'Line Total']
                ];
                data.line_items.forEach(item => {
                    lineItemsData.push([
                        item.line_number || '',
                        item.product_code || '',
                        item.description || '',
                        item.quantity || 0,
                        item.unit || '',
                        item.unit_price || 0,
                        item.vat_rate || '',
                        item.line_total || 0
                    ]);
                });
                const wsLineItems = XLSX.utils.aoa_to_sheet(lineItemsData);
                XLSX.utils.book_append_sheet(wb, wsLineItems, 'Line Items');
            }

            // Download
            const excelFilename = filename.replace(/\.[^/.]+$/, '') + '.xlsx';
            XLSX.writeFile(wb, excelFilename);
        }

        function getDefaultPrompt() {
            return `You are an invoice data extraction system. Extract all relevant information from this invoice image and return it as valid JSON.

CRITICAL: This invoice is being received BY "S D Ramsden & Co Ltd" (also known as "Ramsden International").
They are the CUSTOMER/BUYER, NOT the supplier.
The supplier_name must be the OTHER company - the one SENDING/ISSUING the invoice TO Ramsden.

Extract the following information:

HEADER FIELDS:
- supplier_name: The company SENDING this invoice (the vendor/seller) - NOT Ramsden
- customer_name: The company RECEIVING this invoice (will be S D Ramsden & Co Ltd or Ramsden International)
- invoice_number: The unique invoice identifier
- invoice_date: Date the invoice was issued (format: YYYY-MM-DD)
- po_reference: Purchase order number if present (null if not found)
- currency: Three-letter currency code (e.g., GBP, EUR, USD)
- net_total: Total before tax
- vat_amount: Total VAT/tax amount
- gross_total: Total including tax
- payment_due_date: Payment due date if shown (format: YYYY-MM-DD, null if not found)

LINE ITEMS (for each item):
- line_number: Sequential line number (1, 2, 3...)
- product_code: Product/item code if shown (null if not present)
- description: Item description
- quantity: Number of items
- unit: Unit of measure
- unit_price: Price per unit
- vat_rate: VAT percentage for this line if shown
- line_total: Total for this line

Return ONLY valid JSON with "header" and "line_items" fields.`;
        }
    </script>
</body>
</html>
