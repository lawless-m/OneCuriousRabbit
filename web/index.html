<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice OCR</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .subtitle {
            color: #666;
            margin-bottom: 2rem;
        }

        .status-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 0.75rem 1rem;
            background: white;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.connected { background: #22c55e; }
        .status-dot.error { background: #ef4444; }

        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 3rem;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .drop-zone.processing {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .drop-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .drop-text {
            color: #666;
        }

        .drop-text strong {
            color: #2563eb;
        }

        input[type="file"] {
            display: none;
        }

        .results {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .results-header {
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
        }

        .result-item {
            padding: 1rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .result-filename {
            font-weight: 500;
        }

        .result-confidence {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            background: #dcfce7;
            color: #166534;
        }

        .result-confidence.low {
            background: #fef3c7;
            color: #92400e;
        }

        .result-details {
            font-size: 0.875rem;
            color: #666;
        }

        .result-json {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f9fafb;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 200px;
            overflow: auto;
            display: none;
        }

        .result-json.show {
            display: block;
        }

        .result-preview {
            margin-top: 0.75rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            max-height: 500px;
        }

        .result-preview iframe,
        .result-preview img {
            width: 100%;
            height: 500px;
            border: none;
            display: block;
        }

        .result-preview img {
            height: auto;
            max-height: 500px;
            object-fit: contain;
            background: #f9fafb;
        }

        .toggle-json {
            font-size: 0.75rem;
            color: #2563eb;
            cursor: pointer;
            text-decoration: underline;
            margin-right: 1rem;
        }

        .download-btn {
            font-size: 0.75rem;
            color: #059669;
            cursor: pointer;
            text-decoration: underline;
        }

        .error-message {
            color: #dc2626;
            padding: 1rem;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .settings {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        .settings label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .settings input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Invoice OCR</h1>
        <p class="subtitle">Extract structured data from PDF invoices</p>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot" id="serverStatus"></span>
                <span id="serverStatusText">Checking server...</span>
            </div>
            <div class="status-item" id="modelInfo" style="display: none;">
                Model: <span id="modelName">-</span>
            </div>
        </div>

        <!-- Server URL hidden - using relative paths for reverse proxy -->
        <input type="hidden" id="serverUrl" value="api">

        <div class="drop-zone" id="dropZone">
            <div class="drop-icon">📄</div>
            <p class="drop-text">
                <strong>Drop PDF here</strong> or click to browse
            </p>
            <input type="file" id="fileInput" accept=".pdf,image/*" multiple>
        </div>

        <div class="results" id="results" style="display: none;">
            <div class="results-header">Extraction Results</div>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const results = document.getElementById('results');
        const resultsList = document.getElementById('resultsList');
        const extractionData = {}; // Store extraction results for download
        const fileData = {}; // Store file data for preview

        function getServerUrl() {
            return document.getElementById('serverUrl').value.trim();
        }

        // Check server status
        async function checkStatus() {
            const statusDot = document.getElementById('serverStatus');
            const statusText = document.getElementById('serverStatusText');
            const modelInfo = document.getElementById('modelInfo');
            const modelName = document.getElementById('modelName');

            try {
                const res = await fetch(`${getServerUrl()}/status`, { timeout: 5000 });
                const data = await res.json();

                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Ready';

                if (data.model_loaded) {
                    modelInfo.style.display = 'block';
                    modelName.textContent = data.model_name || 'Loaded';
                } else {
                    modelInfo.style.display = 'block';
                    modelName.textContent = 'Will load on first upload (~30s)';
                }
            } catch (e) {
                statusDot.className = 'status-dot error';
                statusText.textContent = '⚠️ Server offline or not properly configured';
                modelInfo.style.display = 'none';
            }
        }

        // Check status on load
        checkStatus();
        setInterval(checkStatus, 10000);

        // Drag and drop
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
        });

        async function handleFiles(files) {
            // Clear previous results
            resultsList.innerHTML = '';
            results.style.display = 'none';
            // Clear stored data
            Object.keys(extractionData).forEach(k => delete extractionData[k]);
            Object.keys(fileData).forEach(k => delete fileData[k]);

            for (const file of files) {
                await processFile(file);
            }
        }

        async function processFile(file) {
            results.style.display = 'block';

            // Add processing indicator
            const itemId = 'result-' + Date.now();
            resultsList.insertAdjacentHTML('afterbegin', `
                <div class="result-item" id="${itemId}">
                    <div class="result-header">
                        <span class="result-filename">
                            <span class="spinner"></span>
                            ${file.name}
                        </span>
                    </div>
                    <div class="result-details">Processing...</div>
                </div>
            `);

            dropZone.classList.add('processing');

            try {
                // Convert file to base64
                const base64 = await fileToBase64(file);

                // Store file data for preview
                const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                const mimeType = isPdf ? 'application/pdf' : file.type;
                fileData[itemId] = { base64, mimeType, isPdf };

                // Send to server
                const res = await fetch(`${getServerUrl()}/extract-base64`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename: file.name,
                        data: base64,
                        prompt: getDefaultPrompt()
                    })
                });

                const data = await res.json();

                if (data.success) {
                    updateResult(itemId, file.name, data.data, true);
                } else {
                    updateResult(itemId, file.name, { error: data.error }, false);
                }
            } catch (e) {
                let errorMsg = e.message;
                if (e.message.includes('Failed to fetch')) {
                    errorMsg = 'Server not responding - check if inference server is running at ' + getServerUrl();
                } else if (e.message.includes('NetworkError')) {
                    errorMsg = 'Network error - cannot reach server at ' + getServerUrl();
                }
                updateResult(itemId, file.name, { error: errorMsg }, false);
            }

            dropZone.classList.remove('processing');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
            });
        }

        function updateResult(itemId, filename, data, success) {
            const item = document.getElementById(itemId);

            if (success && data.not_invoice) {
                // Document is not an invoice
                const fd = fileData[itemId];
                let previewHtml = '';
                if (fd) {
                    if (fd.isPdf) {
                        previewHtml = `<div class="result-preview"><iframe src="data:application/pdf;base64,${fd.base64}"></iframe></div>`;
                    } else {
                        previewHtml = `<div class="result-preview"><img src="data:${fd.mimeType};base64,${fd.base64}" alt="Document preview"></div>`;
                    }
                }

                item.innerHTML = `
                    <div class="result-header">
                        <span class="result-filename">${filename}</span>
                        <span class="result-confidence low">Not an invoice</span>
                    </div>
                    <div class="result-details">
                        This document appears to be: <strong>${data.document_type || 'unknown document type'}</strong>
                    </div>
                    ${previewHtml}
                `;
            } else if (success && (data.header || data.supplier_name || data.invoice_number)) {
                // Handle both nested (data.header) and flat formats
                const header = data.header || data;
                // Store extraction data for download
                extractionData[itemId] = { filename, data };
                const confidence = data.confidence?.overall || header.confidence?.overall;
                const confidenceClass = confidence && confidence < 0.7 ? 'low' : '';
                const confidenceText = confidence ? `${(confidence * 100).toFixed(0)}% confidence` : '';
                const lineItems = data.line_items || header.line_items || [];
                const lineCount = lineItems.length;

                // Build preview HTML
                const fd = fileData[itemId];
                let previewHtml = '';
                if (fd) {
                    if (fd.isPdf) {
                        previewHtml = `<div class="result-preview"><iframe src="data:application/pdf;base64,${fd.base64}"></iframe></div>`;
                    } else {
                        previewHtml = `<div class="result-preview"><img src="data:${fd.mimeType};base64,${fd.base64}" alt="Document preview"></div>`;
                    }
                }

                item.innerHTML = `
                    <div class="result-header">
                        <span class="result-filename">${filename}</span>
                        ${confidenceText ? `<span class="result-confidence ${confidenceClass}">${confidenceText}</span>` : ''}
                    </div>
                    <div class="result-details">
                        <strong>${header.supplier_name || 'Unknown'}</strong> -
                        Invoice ${header.invoice_number || 'N/A'} -
                        ${header.currency || ''} ${parseFloat(header.gross_total || 0).toFixed(2)} -
                        ${lineCount} line item${lineCount !== 1 ? 's' : ''}
                        <span class="toggle-json" onclick="toggleJson('${itemId}')">Show JSON</span>
                        <span class="download-btn" onclick="downloadExcel('${itemId}', '${filename}')">Download Excel</span>
                    </div>
                    <pre class="result-json" id="json-${itemId}">${JSON.stringify(data, null, 2)}</pre>
                    ${previewHtml}
                `;
            } else {
                let errorDetails = data.error || '';
                let helpText = '';

                // Build preview for errors too
                const fd = fileData[itemId];
                let previewHtml = '';
                if (fd) {
                    if (fd.isPdf) {
                        previewHtml = `<div class="result-preview"><iframe src="data:application/pdf;base64,${fd.base64}"></iframe></div>`;
                    } else {
                        previewHtml = `<div class="result-preview"><img src="data:${fd.mimeType};base64,${fd.base64}" alt="Document preview"></div>`;
                    }
                }

                if (errorDetails.includes('Server not responding')) {
                    helpText = '<br><small>The backend inference server is not responding. Check server logs.</small>';
                } else if (errorDetails.includes('out of memory') || errorDetails.includes('OOM')) {
                    helpText = '<br><small>GPU is busy with another task. Wait a moment and try again.</small>';
                } else if (errorDetails.includes('timeout')) {
                    helpText = '<br><small>Model is loading (may take 30-60 seconds on first request).</small>';
                } else if (!errorDetails && success) {
                    // Model returned something but not in expected format
                    errorDetails = 'Model returned unexpected format';
                    helpText = `<br><small>Response: ${JSON.stringify(data).substring(0, 200)}...</small>`;
                } else if (!errorDetails) {
                    errorDetails = 'Unknown error';
                }

                item.innerHTML = `
                    <div class="result-header">
                        <span class="result-filename">${filename}</span>
                    </div>
                    <div class="error-message">
                        ${errorDetails}
                        ${helpText}
                    </div>
                    ${previewHtml}
                `;
            }
        }

        function toggleJson(itemId) {
            const json = document.getElementById('json-' + itemId);
            json.classList.toggle('show');
        }

        function downloadExcel(itemId, filename) {
            const extraction = extractionData[itemId];
            if (!extraction) return;

            const { data } = extraction;
            const header = data.header || data;

            // Create workbook
            const wb = XLSX.utils.book_new();

            // Header sheet
            const headerData = [
                ['Field', 'Value'],
                ['Supplier', header.supplier_name || ''],
                ['Customer', header.customer_name || ''],
                ['Invoice Number', header.invoice_number || ''],
                ['Invoice Date', header.invoice_date || ''],
                ['PO Reference', header.po_reference || ''],
                ['Currency', header.currency || ''],
                ['Net Total', header.net_total || 0],
                ['VAT Amount', header.vat_amount || 0],
                ['Gross Total', header.gross_total || 0],
                ['Payment Due Date', header.payment_due_date || '']
            ];
            const wsHeader = XLSX.utils.aoa_to_sheet(headerData);
            XLSX.utils.book_append_sheet(wb, wsHeader, 'Header');

            // Line items sheet
            const lineItems = data.line_items || header.line_items || [];
            if (lineItems.length > 0) {
                const lineItemsData = [
                    ['Line', 'Product Code', 'Description', 'Quantity', 'Unit', 'Unit Price', 'VAT Rate', 'Line Total']
                ];
                lineItems.forEach(item => {
                    lineItemsData.push([
                        item.line_number || '',
                        item.product_code || '',
                        item.description || '',
                        item.quantity || 0,
                        item.unit || '',
                        item.unit_price || 0,
                        item.vat_rate || '',
                        item.line_total || 0
                    ]);
                });
                const wsLineItems = XLSX.utils.aoa_to_sheet(lineItemsData);
                XLSX.utils.book_append_sheet(wb, wsLineItems, 'Line Items');
            }

            // Download
            const excelFilename = filename.replace(/\.[^/.]+$/, '') + '.xlsx';
            XLSX.writeFile(wb, excelFilename);
        }

        function getDefaultPrompt() {
            return `You are an invoice data extraction system. First, determine if this document is an invoice or similar financial document (bill, receipt, credit note, statement).

If this is NOT an invoice or financial document, return ONLY this JSON:
{"not_invoice": true, "document_type": "describe what type of document this appears to be"}

CRITICAL RULES:
1. NEVER invent or hallucinate data. Only extract text that is actually visible in the document.
2. If you cannot read a value clearly, use null - do NOT make up placeholder values like "ABC123", "Product A", "XYZ456" etc.
3. Every value you return must be directly readable from the document image.
4. Line items include ANY itemized charges - look for: product lines, service charges, fees, "description of charges", itemized costs, shipping charges, handling fees, etc. If there are charges listed with amounts, extract them as line items.

If this IS an invoice, extract all relevant information and return it as valid JSON.

CRITICAL: This invoice is being received BY "S D Ramsden & Co Ltd" (also known as "Ramsden International").
They are the CUSTOMER/BUYER, NOT the supplier.
The supplier_name must be the OTHER company - the one SENDING/ISSUING the invoice TO Ramsden.

Extract the following information:

HEADER FIELDS:
- supplier_name: The company SENDING this invoice (the vendor/seller) - NOT Ramsden
- customer_name: The company RECEIVING this invoice (will be S D Ramsden & Co Ltd or Ramsden International)
- invoice_number: The unique invoice identifier
- invoice_date: Date the invoice was issued (format: YYYY-MM-DD)
- po_reference: Purchase order number if present (null if not found)
- currency: Three-letter currency code (e.g., GBP, EUR, USD)
- net_total: Total before tax
- vat_amount: Total VAT/tax amount
- gross_total: Total including tax
- payment_due_date: Payment due date if shown (format: YYYY-MM-DD, null if not found)

LINE ITEMS (for each item):
- line_number: Sequential line number (1, 2, 3...)
- product_code: Product/item code if shown (null if not present)
- description: Item description
- quantity: Number of items
- unit: Unit of measure
- unit_price: Price per unit
- vat_rate: VAT percentage for this line if shown
- line_total: Total for this line

Return ONLY valid JSON with "header" and "line_items" fields.`;
        }
    </script>
</body>
</html>
