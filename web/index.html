<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice OCR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .subtitle {
            color: #666;
            margin-bottom: 2rem;
        }

        .status-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 0.75rem 1rem;
            background: white;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.connected { background: #22c55e; }
        .status-dot.error { background: #ef4444; }

        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 3rem;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .drop-zone.processing {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .drop-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .drop-text {
            color: #666;
        }

        .drop-text strong {
            color: #2563eb;
        }

        input[type="file"] {
            display: none;
        }

        .results {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .results-header {
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
        }

        .result-item {
            padding: 1rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .result-filename {
            font-weight: 500;
        }

        .result-confidence {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            background: #dcfce7;
            color: #166534;
        }

        .result-confidence.low {
            background: #fef3c7;
            color: #92400e;
        }

        .result-details {
            font-size: 0.875rem;
            color: #666;
        }

        .result-json {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f9fafb;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 200px;
            overflow: auto;
            display: none;
        }

        .result-json.show {
            display: block;
        }

        .toggle-json {
            font-size: 0.75rem;
            color: #2563eb;
            cursor: pointer;
            text-decoration: underline;
        }

        .error-message {
            color: #dc2626;
            padding: 1rem;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .settings {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        .settings label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .settings input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Invoice OCR</h1>
        <p class="subtitle">Extract structured data from PDF invoices</p>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot" id="serverStatus"></span>
                <span id="serverStatusText">Checking server...</span>
            </div>
            <div class="status-item" id="modelInfo" style="display: none;">
                Model: <span id="modelName">-</span>
            </div>
        </div>

        <div class="settings">
            <label for="serverUrl">Server URL</label>
            <input type="text" id="serverUrl" value="http://127.0.0.1:8765" onchange="checkStatus()">
        </div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-icon">📄</div>
            <p class="drop-text">
                <strong>Drop PDF here</strong> or click to browse
            </p>
            <input type="file" id="fileInput" accept=".pdf,image/*" multiple>
        </div>

        <div class="results" id="results" style="display: none;">
            <div class="results-header">Extraction Results</div>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const results = document.getElementById('results');
        const resultsList = document.getElementById('resultsList');

        function getServerUrl() {
            return document.getElementById('serverUrl').value.trim();
        }

        // Check server status
        async function checkStatus() {
            const statusDot = document.getElementById('serverStatus');
            const statusText = document.getElementById('serverStatusText');
            const modelInfo = document.getElementById('modelInfo');
            const modelName = document.getElementById('modelName');

            try {
                const res = await fetch(`${getServerUrl()}/status`);
                const data = await res.json();

                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Server connected';

                if (data.model_loaded) {
                    modelInfo.style.display = 'block';
                    modelName.textContent = data.model_name || 'Loaded';
                } else {
                    modelInfo.style.display = 'block';
                    modelName.textContent = 'Not loaded (will load on first request)';
                }
            } catch (e) {
                statusDot.className = 'status-dot error';
                statusText.textContent = 'Server not connected';
                modelInfo.style.display = 'none';
            }
        }

        // Check status on load
        checkStatus();
        setInterval(checkStatus, 10000);

        // Drag and drop
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
        });

        async function handleFiles(files) {
            for (const file of files) {
                await processFile(file);
            }
        }

        async function processFile(file) {
            results.style.display = 'block';

            // Add processing indicator
            const itemId = 'result-' + Date.now();
            resultsList.insertAdjacentHTML('afterbegin', `
                <div class="result-item" id="${itemId}">
                    <div class="result-header">
                        <span class="result-filename">
                            <span class="spinner"></span>
                            ${file.name}
                        </span>
                    </div>
                    <div class="result-details">Processing...</div>
                </div>
            `);

            dropZone.classList.add('processing');

            try {
                // Convert file to base64
                const base64 = await fileToBase64(file);

                // Send to server
                const res = await fetch(`${getServerUrl()}/extract-base64`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename: file.name,
                        data: base64,
                        prompt: getDefaultPrompt()
                    })
                });

                const data = await res.json();

                if (data.success) {
                    updateResult(itemId, file.name, data.data, true);
                } else {
                    updateResult(itemId, file.name, { error: data.error }, false);
                }
            } catch (e) {
                updateResult(itemId, file.name, { error: e.message }, false);
            }

            dropZone.classList.remove('processing');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
            });
        }

        function updateResult(itemId, filename, data, success) {
            const item = document.getElementById(itemId);

            if (success && data.header) {
                const confidence = data.confidence?.overall || 0;
                const confidenceClass = confidence < 0.7 ? 'low' : '';
                const lineCount = data.line_items?.length || 0;

                item.innerHTML = `
                    <div class="result-header">
                        <span class="result-filename">${filename}</span>
                        <span class="result-confidence ${confidenceClass}">${(confidence * 100).toFixed(0)}% confidence</span>
                    </div>
                    <div class="result-details">
                        <strong>${data.header.supplier_name || 'Unknown'}</strong> -
                        Invoice ${data.header.invoice_number || 'N/A'} -
                        ${data.header.currency || ''} ${data.header.gross_total?.toFixed(2) || '0.00'} -
                        ${lineCount} line item${lineCount !== 1 ? 's' : ''}
                        <span class="toggle-json" onclick="toggleJson('${itemId}')">Show JSON</span>
                    </div>
                    <pre class="result-json" id="json-${itemId}">${JSON.stringify(data, null, 2)}</pre>
                `;
            } else {
                item.innerHTML = `
                    <div class="result-header">
                        <span class="result-filename">${filename}</span>
                    </div>
                    <div class="error-message">Error: ${data.error || 'Unknown error'}</div>
                `;
            }
        }

        function toggleJson(itemId) {
            const json = document.getElementById('json-' + itemId);
            json.classList.toggle('show');
        }

        function getDefaultPrompt() {
            return `You are an invoice data extraction system. Extract all relevant information from this invoice image and return it as valid JSON.

Extract the following information:

HEADER FIELDS:
- supplier_name: The company issuing the invoice
- invoice_number: The unique invoice identifier
- invoice_date: Date the invoice was issued (format: YYYY-MM-DD)
- po_reference: Purchase order number if present (null if not found)
- currency: Three-letter currency code (e.g., GBP, EUR, USD)
- net_total: Total before tax
- vat_amount: Total VAT/tax amount
- gross_total: Total including tax
- payment_due_date: Payment due date if shown (format: YYYY-MM-DD, null if not found)

LINE ITEMS (for each item):
- line_number: Sequential line number (1, 2, 3...)
- product_code: Product/item code if shown (null if not present)
- description: Item description
- quantity: Number of items
- unit: Unit of measure
- unit_price: Price per unit
- vat_rate: VAT percentage for this line if shown
- line_total: Total for this line

Return ONLY valid JSON with "header" and "line_items" fields.`;
        }
    </script>
</body>
</html>
